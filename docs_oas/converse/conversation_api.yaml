openapi: 3.0.3
info:
  title: Converse 2.0 Conversation API
  version: "1.0"
  description: |
    Close, transfer and look up Converse 2.0 conversations.

    Converse 2.0 was formerly known as Moobidesk Enterprise. Hostnames still use the
    `moobidesk.com` domain.

    A *conversation* is the unit of work in Converse 2.0 — the equivalent of a ticket. It groups
    every message exchanged with one contact on one channel, and carries a status, a queue
    and an assigned agent.

    ## Authentication

    Every request is authenticated with an `apiKey` / `apiSecret` pair issued by 8x8 for
    your account. Unlike most 8x8 APIs, **both are sent as properties of the JSON request
    body**, not as headers:

    ```json
    { "apiKey": "your-api-key", "apiSecret": "your-api-secret" }
    ```

    Treat both values as secrets and never log them.

    ## Obtaining UUIDs

    Every operation here needs UUIDs that only your tenant configuration can supply —
    `dispositionUUID`, `queueUUID`, `agentUUID`, `channelAccountUUID`. Retrieve them with the
    **Converse 2.0 Setup API** before calling anything in this API.

    ## Response envelope

    All operations return the same envelope:

    ```json
    { "status": "Ok",     "message": "Success" }
    { "status": "Failed", "message": "<error_message>" }
    ```

    A failed operation is still returned with HTTP 200 and `status: "Failed"` — check the
    `status` property rather than relying on the HTTP status code alone.
  contact:
    name: 8x8 Converse 2.0
    email: cpaas-sales@8x8.com
servers:
  - url: https://api18.moobidesk.com
    description: Production
tags:
  - name: Converse 2.0 Conversation API
    description: Close, transfer and look up conversations.
paths:
  /rest/api/conversation/close:
    post:
      security: []
      operationId: close-conversation
      summary: Close a conversation
      tags:
        - Converse 2.0 Conversation API
      description: |
        Closes a specific conversation with a disposition, and optionally attaches a closing
        note and attachments.

        The agent named in `agentUsername` / `agentUUID` does not have to be the agent
        currently assigned to the conversation. When it is a different agent, Converse 2.0 checks
        that they hold the privilege to close it and rejects the call if they do not.

        `dispositionUUID` must already exist — the operation fails if it does not. Retrieve
        valid dispositions for the conversation's queue with the Converse 2.0 Setup API's
        **List queues** operation, passing `disposition: true`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseConversationRequest"
            examples:
              withNoteAndAttachment:
                summary: Close with a note and an image attachment
                value:
                  apiKey: 58449c15-your-api-key
                  apiSecret: 271bcd5e-your-api-secret
                  conversationUUID: 84013f0d-1ef5-5418-b735-4a1f0c6d92e1
                  agentUUID: 7b3cd796-7e74-48af-83e6-2c9a7b1e4d55
                  dispositionUUID: 7db68cd3-9f21-4c07-a3e8-51b6d0c7f9a2
                  closingNote: "Order #123-45678. Wrong colour shoes sent (see attachment)."
                  closingAttachments:
                    - contentType: image
                      url: https://example.com/assets/sample.jpg
                      refId: ff9d8420-4a92-5125-bd1c-77e0a5c3b8d4
              minimal:
                summary: Close by agent username, no note
                value:
                  apiKey: 58449c15-your-api-key
                  apiSecret: 271bcd5e-your-api-secret
                  conversationUUID: 84013f0d-1ef5-5418-b735-4a1f0c6d92e1
                  agentUsername: agent@example.com
                  dispositionUUID: 7db68cd3-9f21-4c07-a3e8-51b6d0c7f9a2
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
  /rest/api/conversation/transfer:
    post:
      security: []
      operationId: transfer-conversation
      summary: Transfer a conversation
      tags:
        - Converse 2.0 Conversation API
      description: |
        Transfers a conversation to another queue or to a specific agent, optionally
        attaching a note, attachments and tags.

        Both `conversation` and `transferee` use a compound string syntax rather than plain
        UUIDs — see the field descriptions and the examples below.

        ### Constraint worth knowing

        When `conversation` is supplied in the `conversation:uuid:{uuid}` form, the short
        `agent:...` form of `transferee` is **not accepted**, because the destination queue
        cannot be resolved from the request. Use
        `queue:uuid:{queueUUID}/agent:uuid:{agentUUID}` instead.

        ### Notifications

        A status change caused by a transfer does **not** trigger a Conversation Status
        Update notification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferConversationRequest"
            examples:
              toQueueByContact:
                summary: Transfer to a queue, identifying the conversation by contact
                value:
                  apiKey: 58449c15-your-api-key
                  apiSecret: 271bcd5e-your-api-secret
                  conversation: contact:WhatsApp:6597270000/queue:uuid:0302116a-6b1d-4f8e-9c37-2d5a8e0b7c44/channelaccount:uuid:8abc8cde-196e-5d95-9210-3f7b2c1d6e88
                  transferee: queue:uuid:588c4b20-68b5-11ea-b950-0a1b2c3d4e5f
                  transferNote: Customer enquiry is best handled by Sales.
                  tags:
                    - sales
                    - vip
                  sendAutoResponder: true
              toAgentInAnotherQueue:
                summary: Transfer to a specific agent in a different queue
                value:
                  apiKey: 58449c15-your-api-key
                  apiSecret: 271bcd5e-your-api-secret
                  conversation: conversation:uuid:8d874712-7f3b-5a26-a848-9e0c1b2a3d4f
                  transferee: queue:uuid:588c4b20-68b5-11ea-b950-0a1b2c3d4e5f/agent:username:agent@example.com
      responses:
        "200":
          $ref: "#/components/responses/Envelope"
  /rest/api/conversation/list-by-contact-uuid:
    post:
      security: []
      operationId: list-active-conversations-by-contact
      summary: List a contact's active conversations
      tags:
        - Converse 2.0 Conversation API
      servers:
        - url: https://e18.moobidesk.com
          description: Production
      description: |
        Returns the active conversations of one contact, each with its first and last
        message, its queue and its assigned agent.

        Identify the contact by `uuid` or by `mobile` — at least one of the two is required.

        Note this operation is served from `https://e18.moobidesk.com`, not the
        `api18` host used by the other operations in this API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListActiveConversationsRequest"
            examples:
              byUuid:
                summary: Look up by contact UUID
                value:
                  apiKey: 58449c15-your-api-key
                  apiSecret: 271bcd5e-your-api-secret
                  uuid: 1cf2ed48-b259-483d-d065-3a7b9c0d1e2f
              byMobile:
                summary: Look up by mobile number
                value:
                  apiKey: 58449c15-your-api-key
                  apiSecret: 271bcd5e-your-api-secret
                  mobile: "6596270000"
      responses:
        "200":
          description: The contact's active conversations.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      timestamp:
                        type: integer
                        format: int64
                        description: Epoch milliseconds at which the response was produced.
                      data:
                        type: object
                        properties:
                          conversations:
                            type: array
                            description: The contact's active conversations.
                            items:
                              $ref: "#/components/schemas/ActiveConversation"
              example:
                status: Ok
                message: Success
                timestamp: 1639529803541
                data:
                  conversations:
                    - uuid: 7ae6c41a-6fe4-4b5b-8b6d-21a3c4d5e6f7
                      contact:
                        uuid: 1cf2ed48-b259-483d-d065-3a7b9c0d1e2f
                      firstMessageChat:
                        uuid: 9c4bf769-8879-4e6e-96b7-1a2b3c4d5e6f
                        message: first message
                        createdAt: "2021-12-15T00:32:12.370Z"
                      lastMessageChat:
                        uuid: 66777f4a-fcd7-4d1a-98fb-2b3c4d5e6f70
                        message: last message
                        createdAt: "2021-12-15T00:32:18.315Z"
                      queue:
                        uuid: 0302116a-6b1d-4f8e-9c37-2d5a8e0b7c44
                        name: Queue A
                      agent:
                        uuid: 7b3cd796-7e74-48af-83e6-2c9a7b1e4d55
components:
  responses:
    Envelope:
      description: |
        The standard Converse 2.0 envelope. A rejected operation is also returned with HTTP 200
        and `status: "Failed"` — check `status`, not only the HTTP status code.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
          examples:
            success:
              summary: Success
              value:
                status: Ok
                message: Success
            failure:
              summary: Failure
              value:
                status: Failed
                message: Disposition uuid does not exist
  schemas:
    Envelope:
      type: object
      description: Standard Converse 2.0 response envelope.
      properties:
        status:
          type: string
          description: "`Ok` when the operation succeeded, `Failed` when it did not."
          enum:
            - Ok
            - Failed
        message:
          type: string
          description: "`Success`, or the error message when `status` is `Failed`."
      required:
        - status
        - message
    Credentials:
      type: object
      description: Service credentials, sent in the request body.
      properties:
        apiKey:
          type: string
          description: Your service API key, issued by 8x8. Treat as a secret.
        apiSecret:
          type: string
          description: Your service API secret, issued by 8x8. Treat as a secret.
      required:
        - apiKey
        - apiSecret
    Attachment:
      type: object
      description: |
        An attachment to add to the conversation. Note this object uses `contentType` with a
        coarse content group. Inbound webhooks use a different field name and a full MIME type.
      properties:
        contentType:
          type: string
          description: Coarse content group of the attachment.
          enum:
            - image
            - video
            - audio
            - file
        url:
          type: string
          format: uri
          description: Publicly reachable URL of the attachment.
        caption:
          type: string
          description: Caption, or file name.
        thumbUrl:
          type: string
          format: uri
          description: Publicly reachable URL of a thumbnail image. Used for videos.
        refId:
          type: string
          description: Your own reference id, echoed back for mapping purposes.
      required:
        - contentType
        - url
    CloseConversationRequest:
      allOf:
        - $ref: "#/components/schemas/Credentials"
        - type: object
          properties:
            conversationUUID:
              type: string
              description: UUID of the conversation to close.
            agentUUID:
              type: string
              description: |
                UUID of the agent closing the conversation. Supply either `agentUUID` or
                `agentUsername`.
            agentUsername:
              type: string
              description: |
                Username of the agent closing the conversation. Supply either `agentUUID` or
                `agentUsername`.
            dispositionUUID:
              type: string
              description: |
                UUID of the closing disposition. Must already exist, or the operation fails.
            closingNote:
              type: string
              description: Note to attach to the closure.
            closingAttachments:
              type: array
              description: Attachments to attach to the closure.
              items:
                $ref: "#/components/schemas/Attachment"
          required:
            - conversationUUID
            - dispositionUUID
    TransferConversationRequest:
      allOf:
        - $ref: "#/components/schemas/Credentials"
        - type: object
          properties:
            conversation:
              type: string
              description: |
                The conversation to transfer, as a compound string. One of:

                * `conversation:uuid:{conversationUUID}` — when you know the conversation
                * `contact:uuid:{contactUUID}/queue:uuid:{queueUUID}/channelaccount:uuid:{channelAccountUUID}` — when you know the contact
                * `contact:{channel}:{channelId}/queue:uuid:{queueUUID}/channelaccount:uuid:{channelAccountUUID}` — when you know neither

                `{channel}` accepts: `SMS`, `Email`, `WhatsApp`, `Web Chat`, `WeChat`,
                `Telegram`, `Line`, `Facebook Messenger`, `Facebook Wall`, `Zumata`.
            transferee:
              type: string
              description: |
                The transfer destination, as a compound string. One of:

                * `agent:uuid:{agentUUID}` or `agent:username:{username}` — an agent in the conversation's current queue
                * `queue:uuid:{queueUUID}/agent:uuid:{agentUUID}` — an agent in a different queue
                * `queue:uuid:{queueUUID}` — a queue

                The short `agent:...` forms are rejected when `conversation` is given as
                `conversation:uuid:{uuid}`, because the destination queue cannot be resolved.
            tags:
              type: array
              description: Tags to set on the conversation as part of the transfer.
              items:
                type: string
            sendAutoResponder:
              type: boolean
              description: |
                Whether to send the queue's autoresponder message as part of the transfer.
            transferNote:
              type: string
              description: Note to attach to the transfer.
            transferAttachments:
              type: array
              description: Attachments to attach to the transfer.
              items:
                $ref: "#/components/schemas/Attachment"
          required:
            - conversation
            - transferee
    ListActiveConversationsRequest:
      allOf:
        - $ref: "#/components/schemas/Credentials"
        - type: object
          description: At least one of `uuid` or `mobile` is required.
          properties:
            uuid:
              type: string
              description: UUID of the contact whose conversations are returned.
            mobile:
              type: string
              description: |
                Mobile number of the contact whose conversations are returned, with country
                code and without a leading `+`.
    ActiveConversation:
      type: object
      description: One active conversation belonging to the contact.
      properties:
        uuid:
          type: string
          description: UUID of the conversation.
        contact:
          type: object
          description: The contact the conversation belongs to.
          properties:
            uuid:
              type: string
              description: UUID of the contact.
        firstMessageChat:
          $ref: "#/components/schemas/ChatSummary"
        lastMessageChat:
          $ref: "#/components/schemas/ChatSummary"
        queue:
          type: object
          description: The queue the conversation currently sits in.
          properties:
            uuid:
              type: string
              description: UUID of the queue.
            name:
              type: string
              description: Name of the queue.
        agent:
          type: object
          description: |
            The agent currently assigned to the conversation. Empty when the conversation is
            not yet assigned.
          properties:
            uuid:
              type: string
              description: UUID of the agent.
    ChatSummary:
      type: object
      description: A single message within the conversation.
      properties:
        uuid:
          type: string
          description: UUID of the message.
        message:
          type: string
          description: Text of the message.
        createdAt:
          type: string
          format: date-time
          description: When the message was created.
