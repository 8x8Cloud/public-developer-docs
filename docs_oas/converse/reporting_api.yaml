  #                 url: https://example.com/acwreports/report.csv
components:
  schemas:
    Envelope:
      type: object
      description: Standard Converse 2.0 response envelope.
      properties:
        status:
          type: string
          description: "`Ok` when the request succeeded, `Failed` when it did not."
          enum:
            - Ok
            - Failed
        message:
          type: string
          description: "`Success`, or the error message when `status` is `Failed`."
      required:
        - status
        - message
    Credentials:
      type: object
      description: Service credentials, sent in the request body.
      properties:
        apiKey:
          type: string
          description: Your service API key, issued by 8x8. Treat as a secret.
        apiSecret:
          type: string
          description: Your service API secret, issued by 8x8. Treat as a secret.
      required:
        - apiKey
        - apiSecret
    Page:
      type: object
      description: Paging metadata.
      properties:
        count:
          type: integer
          description: Total number of records matching the request, across all pages.
        limit:
          type: integer
          description: Records per page.
        currentPage:
          type: integer
          description: The page returned.
        lastPage:
          type: integer
          description: Number of the last page available.
    ConversationRecord:
      type: object
      description: One conversation.
      properties:
        uuid:
          type: string
          description: UUID of the conversation.
        type:
          type: string
          description: Channel the conversation took place on.
        contact:
          type: object
          description: The contact the conversation is with.
          properties:
            key:
              type: string
              description: The contact's channel identifier.
            name:
              type: string
            mobile:
              type: string
        conversationStatus:
          type: string
          description: Status of the conversation.
          enum:
            - open
            - assigned
            - read
            - responded
            - closed
        queue:
          type: string
          description: Queue the conversation sits in.
        agent:
          type: string
          description: Agent assigned to the conversation.
        disposition:
          type: string
          description: Disposition the conversation was closed with.
        channelAccountId:
          type: string
          description: Identifier of the channel account.
        channelAccountType:
          type: string
          description: Channel type of the channel account.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ChatRecord:
      type: object
      description: One message within a conversation.
      properties:
        uuid:
          type: string
          description: UUID of the message.
        message:
          type: string
          description: Text of the message.
        channel:
          type: string
          description: Channel the message was sent on.
        direction:
          type: string
          description: "`in` from the customer, `out` to the customer."
          enum:
            - in
            - out
        type:
          type: string
          description: |
            What kind of record this is.

            | Value | Meaning |
            |-------|---------|
            | `chat` | A text message from the customer or the agent |
            | `note` | An internal note added by an agent |
            | `assigned` | The conversation was assigned — adds `assignedQueue` and `assignedAgent` |
            | `closed` | The conversation was closed — adds `disposition` |
          enum:
            - chat
            - note
            - assigned
            - closed
        assignedQueue:
          type: string
          description: Queue assigned to. Present when `type` is `assigned`.
        assignedAgent:
          type: string
          description: Agent assigned to. Present when `type` is `assigned`.
        disposition:
          type: string
          description: Closing disposition. Present when `type` is `closed`.
        attachments:
          type: array
          description: Attachments carried by the message.
          items:
            type: object
        conversation:
          type: string
          description: UUID of the conversation this message belongs to.
        channelAccountId:
          type: string
        channelAccountType:
          type: string
    AgentRecord:
      type: object
      description: One agent.
      properties:
        uuid:
          type: string
          description: UUID of the agent.
        user:
          type: object
          properties:
            username:
              type: string
            name:
              type: string
        channelTypes:
          type: array
          description: Channels the agent handles.
          items:
            type: string
        manager:
          type: string
        supervisor:
          type: string
        status:
          type: string
          enum:
            - active
            - inactive
        type:
          type: string
          description: Whether the agent is a human or a bot.
        remarks:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
