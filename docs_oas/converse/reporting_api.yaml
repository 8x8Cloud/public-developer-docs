openapi: 3.0.3
info:
  title: Converse 2.0 Reporting API
  version: "1.6"
  description: |
    Export conversation, message and agent data from Converse 2.0.

    Converse 2.0 was formerly known as Moobidesk Enterprise. Hostnames still use the
    `moobidesk.com` domain.

    ## These are also the only read APIs

    Converse 2.0 has no "get conversation" or "list messages" operation. If you need to read
    conversation history — not just report on it — these operations are the way to do it.
    **Get conversations data** and **Get chats data** together give you the conversation and
    its messages.

    ## Authentication

    Every request is authenticated with an `apiKey` / `apiSecret` pair issued by 8x8 for your
    account. Both are sent as properties of the JSON request body, not as headers.

    ## Paging

    All operations page at **100 records per page**. Send `page: 1` for the first page, and
    read `data.lastPage` from the response to discover how many pages exist.

    ## Response envelope

    ```json
    { "status": "Ok",     "message": "Success", "data": { ... } }
    { "status": "Failed", "message": "<error_message>" }
    ```

    A failed request is still returned with HTTP 200 and `status: "Failed"` — check the
    `status` property rather than relying on the HTTP status code alone.
  contact:
    name: 8x8 Converse 2.0
    email: cpaas-sales@8x8.com
servers:
  - url: https://api18.moobidesk.com
    description: Production
tags:
  - name: Converse 2.0 Reporting API
    description: Export conversation, message and agent data.
paths:
  /rest/report/conversations:
    post:
      security: []
      operationId: get-conversations-report
      summary: Get conversations data
      tags:
        - Converse 2.0 Reporting API
      description: |
        Returns conversation-level records whose **update** time falls inside the given date
        range.

        To fetch the individual messages of these conversations, pass their UUIDs to **Get
        chats data**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Credentials"
                - type: object
                  properties:
                    from:
                      type: string
                      description: |
                        Start of the date range, as an ISO 8601 timestamp with offset — for
                        example `2026-06-06T00:00:00+0800`. Filters on conversation update
                        time.
                    to:
                      type: string
                      description: End of the date range, as an ISO 8601 timestamp with offset.
                    page:
                      type: integer
                      description: Page number. 100 records per page.
                      default: 1
                  required:
                    - from
                    - to
                    - page
            example:
              apiKey: d2f91886-your-api-key
              apiSecret: aadeff71-your-api-secret
              from: "2026-06-06T00:00:00+0800"
              to: "2026-06-06T23:59:59+0800"
              page: 1
      responses:
        "200":
          description: A page of conversation records.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Page"
                          - type: object
                            properties:
                              conversations:
                                type: array
                                items:
                                  $ref: "#/components/schemas/ConversationRecord"
              example:
                status: Ok
                message: Success
                data:
                  count: 318
                  limit: 100
                  currentPage: 1
                  lastPage: 4
                  conversations:
                    - uuid: 7ae6c41a-6fe4-4b5b-8b6d-21a3c4d5e6f7
                      type: WhatsApp
                      contact:
                        key: "6596270000"
                        name: Joseph Lim
                        mobile: "6596270000"
                      conversationStatus: closed
                      queue: Support
                      agent: agent@example.com
                      disposition: General
                      channelAccountId: "6598765432"
                      channelAccountType: WhatsApp
                      createdAt: "2026-06-06T01:12:04.000Z"
                      updatedAt: "2026-06-06T02:41:55.000Z"
  /rest/report/chats:
    post:
      security: []
      operationId: get-chats-report
      summary: Get chats data
      tags:
        - Converse 2.0 Reporting API
      description: |
        Returns the individual messages of up to **10 conversations** at a time, together with
        the conversation records they belong to.

        Obtain the conversation UUIDs from **Get conversations data**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Credentials"
                - type: object
                  properties:
                    conversations:
                      type: array
                      description: Conversation UUIDs to fetch messages for. Maximum 10.
                      maxItems: 10
                      items:
                        type: string
                    page:
                      type: integer
                      description: Page number. 100 records per page.
                      default: 1
                  required:
                    - conversations
                    - page
            example:
              apiKey: d2f91886-your-api-key
              apiSecret: aadeff71-your-api-secret
              conversations:
                - 7ae6c41a-6fe4-4b5b-8b6d-21a3c4d5e6f7
                - 0a4d6ad7-2a2d-5bdc-b7e5-3c4d5e6f7a8b
              page: 1
      responses:
        "200":
          description: A page of message records, plus the conversations they belong to.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Page"
                          - type: object
                            properties:
                              chats:
                                type: array
                                items:
                                  $ref: "#/components/schemas/ChatRecord"
                              conversations:
                                type: array
                                description: The conversation records the messages belong to.
                                items:
                                  $ref: "#/components/schemas/ConversationRecord"
              example:
                status: Ok
                message: Success
                data:
                  count: 24
                  limit: 100
                  currentPage: 1
                  lastPage: 1
                  chats:
                    - uuid: 9c4bf769-8879-4e6e-96b7-1a2b3c4d5e6f
                      message: Hi, can I ask more about your ongoing promotion?
                      channel: WhatsApp
                      direction: in
                      type: chat
                      conversation: 7ae6c41a-6fe4-4b5b-8b6d-21a3c4d5e6f7
                      channelAccountId: "6598765432"
                      channelAccountType: WhatsApp
                    - uuid: 66777f4a-fcd7-4d1a-98fb-2b3c4d5e6f70
                      message: Conversation closed by agent@example.com
                      channel: WhatsApp
                      direction: out
                      type: closed
                      disposition: General
                      conversation: 7ae6c41a-6fe4-4b5b-8b6d-21a3c4d5e6f7
  /rest/report/agents:
    post:
      security: []
      operationId: get-agents-report
      summary: Get agent data
      tags:
        - Converse 2.0 Reporting API
      description: |
        Returns agent records, including each agent's channels, manager, supervisor and
        status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Credentials"
                - type: object
                  properties:
                    page:
                      type: integer
                      description: Page number.
                      default: 1
                    limit:
                      type: integer
                      description: Records per page.
                      default: 100
                    status:
                      type: string
                      description: Which agents to return.
                      enum:
                        - active
                        - inactive
                      default: active
                  required:
                    - page
            example:
              apiKey: d2f91886-your-api-key
              apiSecret: aadeff71-your-api-secret
              page: 1
              limit: 100
              status: active
      responses:
        "200":
          description: |
            A page of agent records.

            Note the agents array is nested one level deeper than in the other operations —
            `data.data.agents`, not `data.agents`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          data:
                            type: object
                            properties:
                              agents:
                                type: array
                                items:
                                  $ref: "#/components/schemas/AgentRecord"
              example:
                status: Ok
                message: Success
                data:
                  data:
                    agents:
                      - uuid: 7b3cd796-7e74-48af-83e6-2c9a7b1e4d55
                        user:
                          username: agent@example.com
                          name: Amelia Ong
                        channelTypes:
                          - WhatsApp
                          - Email
                        manager: manager@example.com
                        supervisor: supervisor@example.com
                        status: active
                        type: human
                        remarks: ""
                        createdAt: "2025-11-02T04:15:00.000Z"
                        updatedAt: "2026-06-01T09:22:31.000Z"
